services:
  mysql:
    image: mysql:8.0
    container_name: elearning-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_password}
      MYSQL_DATABASE: ELearningSystem
      MYSQL_USER: ${DB_USER:-elearning_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-elearning_pass}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - ./docker/init.sql:/docker-entrypoint-initdb.d/01-init.sql
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u${DB_USER:-elearning_user}", "-p${DB_PASSWORD:-elearning_pass}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
